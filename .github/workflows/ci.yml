# Keeps the four local checks that gate a release honest on every push and PR.
# Nothing here touches AWS: cdk synth runs against a fake account/Region, and
# terraform validate needs no credentials.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  cdk:
    name: TypeScript, lint, web build, cdk synth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint --workspace=web
      - run: npm test --workspace=web
      - run: npm run build:web
      # Docker is available on ubuntu-latest, which the Lambda asset bundling needs.
      - run: npx cdk synth --quiet
        env:
          CDK_DEFAULT_ACCOUNT: "123456789012"
          CDK_DEFAULT_REGION: us-east-1

  terraform:
    name: terraform fmt + validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.*"
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate
